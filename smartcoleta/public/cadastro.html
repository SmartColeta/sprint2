<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SmartColeta | Cadastro</title>

    <script src="./js/sessao.js"></script>

        <link rel="stylesheet" href="style.css">

  </head>

  <body onload="listar()">
    <div class="wrap">
      <!-- Parte esquerda -->
      <aside class="side">
        <img class="brand" src="logo.png" alt="Smart Coleta" />
        <h1>Smart Coleta</h1>
        <p>
          Sistema inteligente para auxiliar no gerenciamento da coleta e
          monitoramento de resíduos.
        </p>
      </aside>

      <!-- Parte direita -->
      <main class="main">
        <div class="card">
          <!-- Abas -->
          <div class="tabs">

            <a href="login.html">
            <button
              class="tab"
              id="loginTab"          
            >
              Entrar
            </button>
            </a>

            <a href="cadastro.html">
            <button
              class="tab"
              id="cadastroTab"            
            >
              Criar conta
            </button>
            </a>

          </div>

          <section id="cadastro">
            <h2>Criar conta</h2>
            <p class="sub">Cadastre-se para acessar o Smart Coleta.</p>

            <!-- TAG FORM CORRIGIDA AQUI -->
            <form onsubmit="realizarCadastro(event)">
              <div class="f">
                <label for="nome">Nome</label>
                <input
                  type="text"
                  id="nome"
                  name="nome"
                  placeholder="Digite seu nome"
                  required
                />
              </div>

              <div class="f">
                <label for="emailCadastro">E-mail</label>
                <input
                  type="email"
                  id="emailCadastro"
                  name="email"
                  placeholder="Digite seu e-mail"
                  required
                />
              </div>

              <div class="f">
                <label for="senhaCadastro">Senha</label>
                <div class="pw">
                  <input
                    type="password"
                    id="senhaCadastro"
                    name="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    required
                  />
                  <button
                    type="button"
                    onclick="mostrarSenha(senhaCadastro, this)"
                  >
                    Mostrar
                  </button>
                </div>
              </div>

              <div class="f">
                <label for="tipoUsuario">Tipo de usuário</label>
                <select id="tipoUsuario" name="tipo" required>
                  <option value="" disabled selected>Selecione o Perfil</option>
                  <option value="usuario">Usuário</option>
                  <option value="administrador">Administrador</option>
                </select>
              </div>

              <button type="submit" class="go">Criar conta</button>
            </form>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>

<script>
  // Array para armazenar empresas cadastradas para validação de código de ativação
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var codigoVar = codigo_input.value;
    var idEmpresaVincular;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      codigoVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id;
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        idEmpresaVincularServer: idEmpresaVincular,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas");
            console.log(listaEmpresasCadastradas[0].codigo_ativacao);
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
