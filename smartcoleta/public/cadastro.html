<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro | SmartColeta</title>

    <script src="./js/sessao.js"></script>

    <!-- Importando icone da aba do navegador -->
    <link rel="icon" href="logos/smartcoleta-logo.svg">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login-cadastro.css" />

    <!--PUXANDO AS FONTES DA API DO GOOGLE-->
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
  </head>

  <body>
    <div class="wrap">
      <!-- Parte esquerda -->
      <aside class="side">
        <img class="brand" src="logos/isologo-light.svg" alt="Smart Coleta" />
        <h1>SmartColeta</h1>
        <p>
          Sistema inteligente para auxiliar no gerenciamento da coleta e
          monitoramento de resíduos.
        </p>
      </aside>

      <!-- Parte direita -->
      <main class="main">
        <div class="card">
          <!-- Abas -->
          <div class="tabs">
            <a href="login.html">
              <button class="tab" id="loginTab">Entrar</button>
            </a>

            <a href="cadastro.html">
              <button class="tab" id="cadastroTab">Criar conta</button>
            </a>
          </div>

          <section id="cadastro">
            <h2>Criar conta</h2>
            <p class="sub">Cadastre-se para acessar o Smart Coleta.</p>

            <form onsubmit="return realizarCadastro()">
              <div class="f">
                <label for="input_nome">Nome</label>
                <input
                  type="text"
                  id="input_nome"
                  placeholder="Digite seu nome"
                  required
                />
              </div>

              <div class="f">
                <label for="input_emailCadastro">E-mail</label>
                <input
                  type="email"
                  id="input_emailCadastro"
                  placeholder="Digite seu e-mail"
                  required
                />
              </div>

              <div class="f">
                <label for="input_qtdHabitantes">Quantidade de Habitantes</label>
                <select id="input_qtdHabitantes" name="tipo" required>
                  <option value="#" disabled selected>Selecione uma opção</option>
                  <option value="1">Até 10.000</option>
                  <option value="2">Entre 10.000 e 20.000</option>
                  <option value="3">Entre 20.000 e 30.000</option>
                  <option value="4">Entre 30.000 e 40.000</option>
                  <option value="5">Entre 40.000 e 50.000</option>
                </select>
              </div>

              <div class="f">
                <label for="input_senha_cadastro">Senha</label>
                <div class="pw">
                  <input
                    type="password"
                    id="input_senha_cadastro"
                    placeholder="Crie uma senha"
                    minlength="6"
                    required
                  />
                  <button
                    type="button"
                    onclick="mostrarSenha(input_senha_cadastro, this)"
                  >
                    Mostrar
                  </button>
                </div>
              </div>

              <div class="f">
                <label for="input_confirmar_senha">Confirmar Senha</label>
                <div class="pw">
                  <input
                    type="password"
                    id="input_confirmar_senha"
                    placeholder="Confirme a senha"
                    minlength="6"
                    required
                  />
                  <button
                    type="button"
                    onclick="mostrarSenha(input_senha_cadastro, this)"
                  >
                  
                </div>
              </div>

              <button type="submit" class="go">Criar conta</button>
            </form>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>

<script>
  function realizarCadastro() {
    let nomeVar = input_nome.value;
    let emailVar = input_emailCadastro.value;
    let senhaVar = input_senha_cadastro.value;
    let confirmacaoSenhaVar = input_confirmar_senha.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      alert("Preencha todos os campos!");
      return false;
    }

    // Verificando se a senha e a confirmação de senha são iguais
    if (senhaVar != confirmacaoSenhaVar) {
      alert("As senhas não são iguais!");
      return false;
    }

    // Enviando os dados
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
     })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          alert(
            "Cadastro realizado com sucesso! Redirecionando para tela de Login..."
          );

          setTimeout(() => {
            window.location = "login.html";
          }, 2000);
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
            .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  

    return false;
  }

  // Mostra ou esconde a senha
  function mostrarSenha(campo, botao) {
    if (campo.type == "password") {
      campo.type = "text";
      botao.innerText = "Ocultar";
    } else {
      campo.type = "password";
      botao.innerText = "Mostrar";
    }
  }
</script>
